<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thông tin tài khoản</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen p-8 flex items-center justify-center">
    <div class="max-w-md w-full bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-2xl">
        <div class="flex items-center justify-between mb-6 border-b border-slate-700/60 pb-4">
            <h2 class="text-xl font-bold text-orange-500 flex items-center gap-2">
                <i class="fa-solid fa-address-card"></i> Thông tin cá nhân
            </h2>
            <a href="index.html" class="text-xs text-slate-400 hover:text-white transition-colors">
                <i class="fa-solid fa-arrow-left"></i> Trang chủ
            </a>
        </div>

        <div class="space-y-3 text-sm">
            <div class="flex justify-between py-2 border-b border-slate-700/40">
                <span class="text-slate-400">ID tài khoản:</span>
                <span id="profileId" class="font-mono font-semibold text-slate-200">---</span>
            </div>
            <div class="flex justify-between py-2 border-b border-slate-700/40">
                <span class="text-slate-400">Tên người dùng:</span>
                <span id="profileUsername" class="font-semibold text-slate-200">---</span>
            </div>
            <div class="flex justify-between py-2 border-b border-slate-700/40">
                <span class="text-slate-400">Vai trò:</span>
                <span id="profileRole" class="px-2 py-0.5 rounded text-xs font-bold bg-orange-500/20 text-orange-400 border border-orange-500/30">---</span>
            </div>
        </div>

        <button onclick="logout()" class="mt-6 w-full bg-red-600/80 hover:bg-red-600 text-white py-2.5 rounded-xl font-semibold transition-all flex items-center justify-center gap-2 shadow-lg shadow-red-600/20">
            <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('accessToken');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const res = await fetch('/auth/account', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const result = await res.json();
                    const user = result.data;
                    document.getElementById('profileId').innerText = user.id;
                    document.getElementById('profileUsername').innerText = user.username;
                    document.getElementById('profileRole').innerText = user.role;
                } else {
                    localStorage.removeItem('accessToken');
                    window.location.href = 'login.html';
                }
            } catch (e) {
                console.error(e);
            }
        });

        async function logout() {
            const token = localStorage.getItem('accessToken');
            try {
                if (token) {
                    await fetch('/auth/logout', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                }
            } catch (e) {
                console.error(e);
            } finally {
                localStorage.removeItem('accessToken');
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
